name: OakReader
options:
  bundleIdPrefix: com.oakreader
  deploymentTarget:
    macOS: "15.4"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  developmentLanguage: en

# Languages the app ships UI for. `en` is the source/development language
# (its strings live inline in the SwiftUI code); the rest are translated in
# OakReader/Resources/Localizable.xcstrings (the String Catalog). Adding a
# region here makes Xcode emit its .lproj and exposes it for system-language
# selection. Order is display-only.
knownRegions:
  - en
  - zh-Hans
  - zh-Hant
  - ja
  - ko
  - de
  - fr
  - es

packages:
  OakAgent:
    path: Packages/OakAgent
  OakMarkdownUI:
    path: Packages/OakMarkdownUI
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  Highlightr:
    url: https://github.com/raspu/Highlightr.git
    from: "2.3.0"
  CMarkGFM:
    url: https://github.com/stackotter/swift-cmark-gfm
    from: "1.0.2"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  OakVoice:
    path: Packages/OakVoice
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser.git
    from: "1.3.0"
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.60.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "15.4"
    ENABLE_STRICT_OBJC_MSGSEND: YES
    # Auto-harvest UI string literals into the String Catalog at build time so
    # new strings can't ship as untranslated English silently.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  OakReader:
    type: application
    platform: macOS
    sources:
      - path: OakReader
        excludes:
          - "**/Info.plist"
          - "**/*.entitlements"
    resources:
      - path: skills
      - path: prompts
    dependencies:
      - package: OakAgent
      - package: OakMarkdownUI
      - package: GRDB
        product: GRDB
      - package: Highlightr
      - package: CMarkGFM
      - package: Sparkle
      - package: OakVoice
      - package: PostHog
        product: PostHog
      - target: oak
    postCompileScripts:
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint || true
          else
            echo "warning: SwiftLint not installed"
          fi
        name: "SwiftLint"
      - script: |
          cp "${BUILT_PRODUCTS_DIR}/oak" "${BUILT_PRODUCTS_DIR}/OakReader.app/Contents/Resources/oak"
        name: "Embed oak CLI"
      # The AI sidecar is a self-contained executable from `bun build --compile`
      # (the Bun runtime is inside it), so the app never looks for `node` and
      # there is no minimum runtime version. Too large to commit -- 63 MB arm64,
      # 132 MB universal -- so it is built here and gitignored. Release builds
      # must be universal to match the app. Being a Mach-O inside the bundle it
      # has to be signed inside-out, before Xcode seals the app.
      - script: |
          set -e
          BACKEND="${SRCROOT}/web/backend"
          export PATH="$PATH:$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin"
          if ! command -v bun >/dev/null 2>&1; then
            echo "error: bun not found — install from https://bun.sh; the AI sidecar is compiled with it" >&2
            exit 1
          fi
          if [ "${CONFIGURATION}" = "Release" ]; then
            OAK_UNIVERSAL=1 bash "$BACKEND/scripts/build-binary.sh"
          else
            bash "$BACKEND/scripts/build-binary.sh"
          fi
          DEST="${BUILT_PRODUCTS_DIR}/OakReader.app/Contents/Resources/oak-backend"
          cp "$BACKEND/dist/oak-backend" "$DEST"
          chmod +x "$DEST"
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ] && [ "${EXPANDED_CODE_SIGN_IDENTITY}" != "-" ]; then
            codesign --force --options runtime --timestamp=none \
                     --sign "${EXPANDED_CODE_SIGN_IDENTITY}" "$DEST"
          else
            codesign --force --sign - "$DEST"
          fi
        name: "Build & embed AI sidecar (bun --compile)"
    # All code-signing config (team, identity, style, entitlements, provisioning)
    # lives in the xcconfig layer, NOT in project.yml, so a contributor can build
    # with their own Apple team — or ad-hoc — by dropping a gitignored
    # xcconfig/DeveloperSettings.xcconfig, without touching any tracked file.
    # Scoped to THIS target only (a global xcodebuild signing override would
    # break the SPM packages and the oak tool). See xcconfig/*.xcconfig and the
    # README "Build" section.
    configFiles:
      Debug: xcconfig/OakReader-debug.xcconfig
      Release: xcconfig/OakReader-release.xcconfig
    settings:
      base:
        PRODUCT_NAME: OakReader
        INFOPLIST_FILE: OakReader/App/Info.plist
        # Marketing version is the release trigger and source of truth: bump it
        # (SemVer X.Y.Z) and merge to main to ship. CURRENT_PROJECT_VERSION is a
        # placeholder; CI overrides it with the git commit count at archive time.
        MARKETING_VERSION: "0.7.14"
        CURRENT_PROJECT_VERSION: "1"
        # Sparkle EdDSA public key (NOT secret). Paste the key printed by
        # Sparkle's generate_keys here after generating the keypair; the matching
        # private key is the SPARKLE_ED_KEY GitHub secret. Empty in dev builds
        # (which don't auto-update) is fine.
        SPARKLE_PUBLIC_ED_KEY: "zm3UpFrDf8tFcctK2vkEhrms6oFTp50AUb824lP9BAw="
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: minimal
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.oakreader.OakReader.dev
          BUNDLE_DISPLAY_NAME: "OakReader Dev"
          # CFBundleName drives the menu bar; CFBundleDisplayName drives Finder
          # and Cmd-Tab. Both must be set or the dev build still says
          # "OakReader" in the menu bar. <= 16 chars or it truncates.
          BUNDLE_NAME: "OakReader Dev"
          # Own URL scheme so the dev and release apps do not both register
          # "oakreader" and let LaunchServices pick between them.
          BUNDLE_URL_SCHEME: "oakreader-dev"
          # Inverted icon so the two builds are distinguishable in the Dock.
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.oakreader.OakReader
          BUNDLE_DISPLAY_NAME: "OakReader"
          BUNDLE_NAME: "OakReader"
          BUNDLE_URL_SCHEME: "oakreader"
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  oak:
    type: tool
    platform: macOS
    sources:
      - path: cli
    dependencies:
      - package: OakAgent
      - package: GRDB
        product: GRDB
      - package: swift-argument-parser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: oak
        SWIFT_STRICT_CONCURRENCY: minimal
        # Keep oak out of the archive's install products — it's embedded into the
        # app bundle by the "Embed oak CLI" script, not shipped as a standalone
        # tool. Leaving it installed bloats the archive with a stray /usr/local/bin/oak.
        SKIP_INSTALL: YES
