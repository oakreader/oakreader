name: OakReader
options:
  bundleIdPrefix: com.oakreader
  deploymentTarget:
    macOS: "15.4"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  developmentLanguage: en

# Languages the app ships UI for. `en` is the source/development language
# (its strings live inline in the SwiftUI code); the rest are translated in
# app/Resources/Localizable.xcstrings (the String Catalog). Adding a
# region here makes Xcode emit its .lproj and exposes it for system-language
# selection. Order is display-only.
knownRegions:
  - en
  - zh-Hans
  - zh-Hant
  - ja
  - ko
  - de
  - fr
  - es

packages:
  OakAgent:
    path: packages/OakAgent
  OakMarkdownUI:
    path: packages/OakMarkdownUI
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  Highlightr:
    url: https://github.com/raspu/Highlightr.git
    from: "2.3.0"
  CMarkGFM:
    url: https://github.com/stackotter/swift-cmark-gfm
    from: "1.0.2"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  OakVoice:
    path: packages/OakVoice
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser.git
    from: "1.3.0"
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.60.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "15.4"
    ENABLE_STRICT_OBJC_MSGSEND: YES
    # Auto-harvest UI string literals into the String Catalog at build time so
    # new strings can't ship as untranslated English silently.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  OakReader:
    type: application
    platform: macOS
    sources:
      - path: app
        excludes:
          - "**/Info.plist"
          - "**/*.entitlements"
    dependencies:
      - package: OakAgent
      - package: OakMarkdownUI
      - package: GRDB
        product: GRDB
      - package: Highlightr
      - package: CMarkGFM
      - package: Sparkle
      - package: OakVoice
      - package: PostHog
        product: PostHog
      - target: oak
    postCompileScripts:
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint || true
          else
            echo "warning: SwiftLint not installed"
          fi
        name: "SwiftLint"
      - script: |
          # CONTENTS_FOLDER_PATH, not a hardcoded OakReader.app: the Debug
          # config overrides PRODUCT_NAME, so its wrapper is OakReader-Dev.app.
          cp "${BUILT_PRODUCTS_DIR}/oak" "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/oak"
        name: "Embed oak CLI"
      # Prompt files travel with the app so the sidecar can read them. They are
      # data, not code: editing one changes what the assistant is told without
      # a rebuild. (project.yml's `resources:` key is invalid XcodeGen and is
      # silently ignored, which is why this is a script phase.)
      - script: |
          set -e
          DEST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/prompts"
          rm -rf "$DEST"
          mkdir -p "$(dirname "$DEST")"
          cp -R "${SRCROOT}/prompts" "$DEST"
        name: "Embed prompts"

      # The AI sidecar is a self-contained executable from `bun build --compile`
      # (the Bun runtime is inside it), so the app never looks for `node` and
      # there is no minimum runtime version. Too large to commit -- 63 MB arm64,
      # 132 MB universal -- so it is built here and gitignored. Release builds
      # must be universal to match the app. Being a Mach-O inside the bundle it
      # has to be signed inside-out, before Xcode seals the app.
      - script: |
          set -e
          BACKEND="${SRCROOT}/backend"
          export PATH="$PATH:$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin"
          if ! command -v bun >/dev/null 2>&1; then
            echo "error: bun not found — install from https://bun.sh; the AI sidecar is compiled with it" >&2
            exit 1
          fi
          if [ "${CONFIGURATION}" = "Release" ]; then
            OAK_UNIVERSAL=1 bash "$BACKEND/scripts/build-binary.sh"
          else
            bash "$BACKEND/scripts/build-binary.sh"
          fi
          # CONTENTS_FOLDER_PATH, not a hardcoded OakReader.app: the Debug
          # config overrides PRODUCT_NAME, so its wrapper is OakReader-Dev.app.
          DEST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/oak-backend"
          cp "$BACKEND/dist/oak-backend" "$DEST"
          chmod +x "$DEST"
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ] && [ "${EXPANDED_CODE_SIGN_IDENTITY}" != "-" ]; then
            codesign --force --options runtime --timestamp=none \
                     --sign "${EXPANDED_CODE_SIGN_IDENTITY}" "$DEST"
          else
            codesign --force --sign - "$DEST"
          fi
        name: "Build & embed AI sidecar (bun --compile)"
    # All code-signing config (team, identity, style, entitlements, provisioning)
    # lives in the xcconfig layer, NOT in project.yml, so a contributor can build
    # with their own Apple team — or ad-hoc — by dropping a gitignored
    # xcconfig/DeveloperSettings.xcconfig, without touching any tracked file.
    # Scoped to THIS target only (a global xcodebuild signing override would
    # break the SPM packages and the oak tool). See xcconfig/*.xcconfig and the
    # README "Build" section.
    configFiles:
      Debug: xcconfig/OakReader-debug.xcconfig
      Release: xcconfig/OakReader-release.xcconfig
    settings:
      base:
        PRODUCT_NAME: OakReader
        # Pinned so the Debug PRODUCT_NAME override below cannot rename the
        # Swift module: PRODUCT_MODULE_NAME defaults to a sanitised PRODUCT_NAME,
        # which would make the dev build's module "OakReader_Dev" and break
        # anything resolving classes by the "OakReader." prefix.
        PRODUCT_MODULE_NAME: OakReader
        INFOPLIST_FILE: app/App/Info.plist
        # Marketing version is the release trigger and source of truth: bump it
        # (SemVer X.Y.Z) and merge to main to ship. CURRENT_PROJECT_VERSION is a
        # placeholder; CI overrides it with the git commit count at archive time.
        MARKETING_VERSION: "0.9.0"
        CURRENT_PROJECT_VERSION: "1"
        # Sparkle EdDSA public key (NOT secret). Paste the key printed by
        # Sparkle's generate_keys here after generating the keypair; the matching
        # private key is the SPARKLE_ED_KEY GitHub secret. Empty in dev builds
        # (which don't auto-update) is fine.
        SPARKLE_PUBLIC_ED_KEY: "zm3UpFrDf8tFcctK2vkEhrms6oFTp50AUb824lP9BAw="
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: minimal
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.oakreader.OakReader.dev
          # The wrapper's FILE name, and the only one the Dock and Finder
          # actually show. They label a tile from the on-disk bundle name, not
          # from CFBundleDisplayName — a localised InfoPlist.strings would
          # override that, but none of the .lproj folders ship one, so
          # localizedInfoDictionary is nil and the filename wins. Without this
          # override the dev build inherits the base PRODUCT_NAME and ships as
          # OakReader.app, so the Dock says "OakReader" no matter what the two
          # BUNDLE_* settings below say. Hyphen, not a space: matches the
          # sibling termio repo's termio-dev and keeps the path quote-free.
          PRODUCT_NAME: "OakReader-Dev"
          BUNDLE_DISPLAY_NAME: "OakReader-Dev"
          # CFBundleName — NOT the same thing as CFBundleDisplayName: the macOS
          # menu bar reads CFBundleName, while the Dock and Finder go by the
          # filename above. All three must agree or the dev build says
          # "OakReader" somewhere. Keep <= 16 chars or the menu bar truncates it.
          BUNDLE_NAME: "OakReader-Dev"
          # Own URL scheme, mirroring termio's dev channel (build-app.sh sets
          # CFBundleURLSchemes to "termio-dev"). Without this the dev and
          # release apps both register "oakreader" and LaunchServices routes
          # oakreader://open to whichever it feels like. NOTE: the browser
          # extension hardcodes oakreader://open, so it now always targets the
          # RELEASE app -- deterministic, where before it was a coin flip.
          BUNDLE_URL_SCHEME: "oakreader-dev"
          # Inverted (light) icon so the dev app is distinguishable from an
          # installed release build in the Dock and Cmd-Tab. Same convention as
          # the sibling termio repo's AppIcon-dev.png. Art lives in
          # Resources/AppIcon-Dev.icon (macOS 26 Icon Composer) and
          # Assets.xcassets/AppIcon-Dev.appiconset (fallback).
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.oakreader.OakReader
          BUNDLE_DISPLAY_NAME: "OakReader"
          BUNDLE_NAME: "OakReader"
          BUNDLE_URL_SCHEME: "oakreader"
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  oak:
    type: tool
    platform: macOS
    sources:
      - path: cli
    dependencies:
      - package: OakAgent
      - package: GRDB
        product: GRDB
      - package: swift-argument-parser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: oak
        SWIFT_STRICT_CONCURRENCY: minimal
        # Keep oak out of the archive's install products — it's embedded into the
        # app bundle by the "Embed oak CLI" script, not shipped as a standalone
        # tool. Leaving it installed bloats the archive with a stray /usr/local/bin/oak.
        SKIP_INSTALL: YES

  # Unit tests for app services that are pure value logic. Deliberately NOT hosted on
  # the OakReader target: that would make every `swift test` run the app's script
  # phases, including the bun --compile of the AI sidecar. Instead the tested file is
  # compiled straight into this bundle, which keeps the suite fast and independent.
  #
  # The constraint that buys that: a file listed here must depend on Foundation only.
  # If one grows an app dependency, host this target on OakReader rather than widening
  # the source list.
  OakReaderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: tests
      - path: app/Services/AI/CitationSourceRegistry.swift
    settings:
      base:
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: YES
